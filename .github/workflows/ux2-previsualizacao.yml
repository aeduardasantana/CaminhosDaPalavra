name: Preparar pré-visualização completa UX 2.0

on:
  pull_request:
    paths:
      - ".github/workflows/ux2-previsualizacao.yml"
      - "ux2.css"
      - "ux2.js"
      - "assets/ux2/**"
      - "historia-da-salvacao.html"
      - "biblia-estudo.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar pacote oficial, isolado da produção
        run: |
          rm -rf dist/ux2-preview
          node scripts/preparar-publicacao.mjs --output dist/ux2-preview
          test -s dist/ux2-preview/index.html
          test -s dist/ux2-preview/dados/biblia-ave-maria/GEN.json
          test -s dist/ux2-preview/verse-index.js
          test -s dist/ux2-preview/dados/vinculos-estudo.json
      - name: Registrar apenas o pacote de homologação na branch de avaliação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A dist/ux2-preview
          if git diff --cached --quiet; then
            echo "Pré-visualização já está atualizada."
          else
            git commit -m "preview(ux2): gerar site completo de homologação sem mudar main"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
