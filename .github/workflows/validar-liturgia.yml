name: Validar calendário litúrgico
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe JavaScript
        run: |
          node --check calendar.js
          node --check aclamacoes.js
          node --check liturgia-diaria.js
          node --check app.js
          node --check liturgia-2025-11.js
          node --check dicionario.js
          node --check estudo-liturgico-2025-11-01a15.js
          node --check estudo-liturgico-2025-11-16a30.js
          node --check estudo-versiculos-2025-11.js
          node --check liturgia-fonte-local.js
          node --check liturgia-br-acervo.js
      - name: Regressões litúrgicas e rastreabilidade
        run: |
          node tests/liturgia-diaria.test.cjs
          node tests/competencia-01.test.cjs
          node tests/calendario-ux.test.cjs
          node tests/dicionario.test.cjs
          node tests/novembro-integracao-editorial.test.cjs
          node tests/fonte-online.test.cjs
          node tests/leitura-limpa-ux.test.cjs
          node tests/glosa-orientacoes-ux.test.cjs
          node tests/salmos-quadros.test.cjs
          node tests/aclamacoes-ferial.test.cjs

