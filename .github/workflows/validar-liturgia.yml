name: Validar calendário litúrgico

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe JavaScript
        run: |
          node --check calendar.js
          node --check aclamacoes.js
          node --check liturgia-diaria.js
          node --check app.js
          node --check theology-data.js
          node --check publication-control.js
          node --check liturgia-2025-11.js
          node --check dicionario.js
          node --check estudo-liturgico-2025-11-01a15.js
          node --check estudo-liturgico-2025-11-16a30.js
          node --check estudo-versiculos-2025-11.js
          node --check liturgia-fonte-local.js
          node --check liturgia-paralelo.js
          node --check liturgia-br-acervo.js
          node --check liturgia-ave-maria-acervo.js
          node --check liturgia-edicoes.js
          node --check scripts/importar-liturgia-br.mjs
          node --check scripts/importar-ave-maria.mjs
          node --check scripts/preparar-publicacao.mjs
      - name: Validar Mapa Bíblico Mestre e controle editorial
        run: |
          node scripts/validate-theology-data.mjs
          node scripts/validate-publication-control.mjs
      - name: Validar pacote público sem enviar ao FTP
        run: node scripts/preparar-publicacao.mjs --check
      - name: Regressões litúrgicas e rastreabilidade
        run: |
          node tests/liturgia-diaria.test.cjs
          node tests/competencia-01.test.cjs
          node tests/calendario-ux.test.cjs
          node tests/dicionario.test.cjs
          node tests/novembro-integracao-editorial.test.cjs
          node tests/fonte-online.test.cjs
          node tests/acervo-local.test.cjs
          node tests/edicoes-liturgicas.test.cjs
          node tests/edicoes-manifest.test.cjs
          node tests/importador-ave-maria.test.cjs
          node tests/cobertura-glosa-novembro.test.cjs
          node tests/glosa-2025-11-06.test.cjs
          node tests/paralelo-sincronizado.test.cjs
          node tests/leitura-limpa-ux.test.cjs
          node tests/glosa-orientacoes-ux.test.cjs
          node tests/salmos-quadros.test.cjs
          node tests/paralelo-alinhado.test.cjs
          node tests/aclamacoes-ferial.test.cjs
          node tests/publicacao-segura.test.cjs
