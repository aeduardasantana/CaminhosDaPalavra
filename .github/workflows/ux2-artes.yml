name: Gerar imagens licenciadas UX 2.0 para avaliação

on:
  pull_request:
    paths:
      - "scripts/ux2-baixar-artes.py"
      - ".github/workflows/ux2-artes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  imagens:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install --quiet pillow
      - name: Baixar e produzir fotografias licenciadas
        run: python scripts/ux2-baixar-artes.py
      - name: Registrar recursos na branch de avaliação, sem tocar na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ux2/*.webp assets/ux2/CREDITOS.md
          if git diff --cached --quiet; then
            echo "Nenhuma mudança."
          else
            git commit -m "assets(ux2): incorporar fotos licenciadas ao repositório"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
